title: Home

columns:
  - width: 1
    fields: 
      titleSection:
        type: headline
        label: Header section

  - width: 3/5
    fields:
      intro:
        label: Subtitle
        type: text

      introIcon:
        label: Subtitle icon
        type: files
        query: page.files.filterBy("extension", "png")
        max: 1

      title1:
        label: Main title part 1
        type: text
        width: 1/3

      ampersand:
        label: Ampersand (&)
        type: text
        width: 1/3

      title3:
        label: Main title part 2
        type: text
        width: 1/3

      description:
        label: Description
        type: textarea

      button1Text:
        label: First button - Text
        type: text
        width: 1/2

      button1Link:
        label: First button - Link
        type: link
        width: 1/2

      button2Text:
        label: Second button - Text
        type: text
        width: 1/2

      button2Link:
        label: Second button - Link
        type: link
        width: 1/2

      socialsTitle:
        label: Subtitle for social media links
        type: text

  - width: 2/5
    fields:
      heroImage:
        label: Hero image
        type: files
        max: 1
        multiple: false
        layout: cards

  - width: 1
    fields:
      aboutDivider:
        type: line
      titleSection2:
        type: headline
        label: About section

      aboutMeSubtitle:
        label: About subtitle
        type: text
        width: 1/2

      subtitleIcon:
        label: Subtitle icon
        type: files
        query: page.files.filterBy("extension", "png")
        max: 1
        width: 1/2

      aboutTitle:
        label: About me section title
        type: text

      aboutMeDescription:
        label: About description
        type: textarea

      skills:
        label: My skills
        type: structure
        fields:
          skill:
            label: Skill
            type: text
            required: true

  - width: 1
    fields:
      mySkillsLine:
        type: line
      mySkillsSection:
        type: headline
        label: My Skills Section

      mySkillsSubtitle:
        label: Subtitle
        type: text
        width: 1/2

      skillsSubtitleIcon:
        label: Subtitle icon
        type: files
        query: page.files.filterBy("extension", "png")
        max: 1
        width: 1/2

      mySkillsTitle: 
        label: My skills section title
        type: text

      skillCards:
        label: Skill cards
        type: structure
        max: 4
        fields:
          icon:
            label: Skill icon
            type: files
            query: page.files.filterBy("extension", "png")
            max: 1

          title:
            label: Card title
            type: text
            required: true

          description:
            label: Card description
            type: textarea

  - width: 1
    fields:
      toolsLine:
        type: line
      myToolsSection:
        type: headline
        label: My tools banner section

      toolsBannerTitle:
        label: Banner title
        type: text

      tools:
        label: Tools
        type: structure
        max: 10
        fields:
          tool:
            label: Tool name
            type: text
            required: true